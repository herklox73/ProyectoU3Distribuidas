# Nginx sirve el build de React y reenvía las rutas de API al backend
# Django dentro de la red de Docker (mismo papel que el proxy de Vite
# en desarrollo). El WebSocket del chat va directo a localhost:3001
# (puerto publicado del servicio whatsapp), no pasa por aquí.
server {
    listen 80;
    client_max_body_size 60M;

    root /usr/share/nginx/html;
    index index.html;

    # Rutas del backend Django
    location ~ ^/(api|whatsapp|admin|auth|media|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120s;
    }

    # WebSocket del gateway de WhatsApp (despliegue en servidor): así el
    # puerto 3001 no necesita estar abierto a internet. Se usa una variable
    # + resolver de Docker para que Nginx arranque aunque el servicio
    # "whatsapp" todavía no exista.
    location /ws/ {
        resolver 127.0.0.11 valid=30s;
        set $wa_upstream http://whatsapp:3001;
        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass $wa_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # React (SPA): cualquier otra ruta devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}
